# Pushing a tag like v0.2.0 builds arranger for macOS and Linux and publishes a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --release
        if: matrix.target != 'x86_64-apple-darwin' # cross-built on arm, can't run there
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          name=arranger-${{ matrix.target }} # no version: install.sh fetches releases/latest/download/<name>
          mkdir "$name"
          cp target/${{ matrix.target }}/release/{arranger,arranger-gui} README.md "$name"/
          if [[ ${{ matrix.target }} == *apple* ]]; then scripts/bundle.sh target/${{ matrix.target }}/release "$name" "$GITHUB_REF_NAME"; fi
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: arranger-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes arranger-*.tar.gz scripts/install.sh
        env:
          GH_TOKEN: ${{ github.token }}
