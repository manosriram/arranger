# Pushing a tag like v0.2.0 builds arranger for macOS and Linux and publishes a GitHub release.
# Before tagging, run `just parity` locally (it needs claude and codex logged in, so CI can't).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl-dev
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --release --locked
        if: matrix.target != 'x86_64-apple-darwin' # cross-built on arm, can't run there
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=arranger-${{ matrix.target }} # no version: install.sh fetches releases/latest/download/<name>
          mkdir "$name"
          cp target/${{ matrix.target }}/release/{arranger,arranger-gui} README.md SECURITY.md SECURITY_AUDIT.md "$name"/
          if [[ ${{ matrix.target }} == *apple* ]]; then scripts/bundle.sh target/${{ matrix.target }}/release "$name" "$GITHUB_REF_NAME"; fi
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: |
            arranger-*.tar.gz
            arranger-*.tar.gz.sha256

  release:
    needs: [build, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes arranger-*.tar.gz arranger-*.tar.gz.sha256 scripts/install.sh
        env:
          GH_TOKEN: ${{ github.token }}
