[package]
name = "arranger"
version = "0.1.33"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
gix = { version = "0.90.0", default-features = false, features = ["sha1", "status", "revision"] }
glow = "0.18.0"
glutin = "0.32"
glutin-winit = "0.5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
imara-diff = "0.2.0"
mio = { version = "1.2.4", features = ["os-poll", "os-ext", "net"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
raw-window-handle = "0.6"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
rustix = { version = "1.1.5", features = ["pty", "termios", "process", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4"
swash = "0.2.10"
# Keep Wayland decorations without pulling its unmaintained title-font parser.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
zstd = "0.14.3"

# Dock icon. Already in the tree through winit; these pin the same versions.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSThread"] }
